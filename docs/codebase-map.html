<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClosedAI codebase map</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #e9e6df; background: #11100f; }
      main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 52px 0 96px; }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -.045em; }
      h2 { margin-top: 52px; padding-top: 16px; border-top: 1px solid #36322e; font-size: 1.55rem; }
      h3 { margin-top: 34px; color: #f1c997; }
      p, li { line-height: 1.65; color: #cbc6bd; }
      blockquote { margin: 20px 0; padding: 12px 18px; border-left: 3px solid #d58d52; background: #191715; }
      blockquote p { margin: 0; }
      strong { color: #f6f1e8; }
      a { color: #f2b778; }
      code { font-family: "Geist Mono", ui-monospace, monospace; color: #f2cfaa; }
      :not(pre) > code { padding: 2px 6px; border: 1px solid #39342f; border-radius: 5px; background: #1b1917; }
      pre { overflow: auto; padding: 20px; border: 1px solid #34302c; border-radius: 10px; background: #171513; line-height: 1.55; }
      table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
      th, td { min-width: 170px; padding: 11px 14px; border: 1px solid #38332e; text-align: left; vertical-align: top; }
      th { color: #f3dfc8; background: #1c1916; }
      td { color: #cbc6bd; }
      .mermaid { margin: 24px 0; padding: 24px; overflow-x: auto; border: 1px solid #38332e; border-radius: 12px; background: #f4efe7; }
      .status { position: sticky; top: 0; z-index: 2; margin: 0 -20px 28px; padding: 10px 20px; border-bottom: 1px solid #302c28; background: color-mix(in srgb, #11100f 92%, transparent); color: #9e978e; backdrop-filter: blur(12px); }
      @media (max-width: 640px) { main { width: min(100% - 24px, 1120px); padding-top: 24px; } th, td { min-width: 145px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="status" id="status">Loading living map…</div>
      <article id="content"></article>
    </main>
    <script src="/node_modules/marked/lib/marked.umd.js"></script>
    <script type="module">
      const status = document.querySelector('#status')
      const content = document.querySelector('#content')
      try {
        const response = await fetch(`./codebase-map.md?v=${Date.now()}`)
        if (!response.ok) throw new Error(`Could not load map (${response.status})`)
        content.innerHTML = marked.parse(await response.text())
        for (const block of content.querySelectorAll('pre code.language-mermaid')) {
          const diagram = document.createElement('div')
          diagram.className = 'mermaid'
          diagram.textContent = block.textContent
          block.parentElement.replaceWith(diagram)
        }
        const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.12.2/dist/mermaid.esm.min.mjs')
        mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' })
        await mermaid.run({ nodes: content.querySelectorAll('.mermaid') })
        status.textContent = 'Live preview · docs/codebase-map.md'
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : 'Could not render the map'
        content.textContent = 'Serve the repository over HTTP, then reload this page.'
      }
    </script>
  </body>
</html>
