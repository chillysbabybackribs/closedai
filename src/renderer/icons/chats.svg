    <linearGradient id="tile-edge" x1="64" y1="4" x2="64" y2="123" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".025"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="jade" x1="61" y1="26" x2="68" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a4d9b9"/>
      <stop offset=".18" stop-color="#7cb592"/>
      <stop offset=".5" stop-color="#52886a"/>
      <stop offset=".8" stop-color="#2c5b43"/>
      <stop offset="1" stop-color="#204734"/>
