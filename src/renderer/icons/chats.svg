  <rect x="4.5" y="4.5" width="119" height="118" rx="28.5" stroke="url(#tile-edge)"/>
  <g filter="url(#bubble-depth)">
    <use href="#bubble" fill="url(#jade)"/>
    <use href="#bubble" fill="url(#jade-light)"/>
    <use href="#bubble" stroke="url(#jade-edge)" stroke-width=".7"/>
