  <!-- Chats dock artwork. Transparent outside the tile; no raster dependencies. -->
  <rect x="4" y="6" width="120" height="119" rx="29" fill="#080a0b" fill-opacity=".6"/>
  <rect x="4" y="4" width="120" height="119" rx="29" fill="url(#tile)"/>
