<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="tile" x1="64" y1="4" x2="64" y2="123" gradientUnits="userSpaceOnUse">
      <stop stop-color="#494c4e"/>
      <stop offset=".16" stop-color="#292c2f"/>
      <stop offset=".72" stop-color="#1c1f21"/>
      <stop offset="1" stop-color="#090b0c"/>
    </linearGradient>
    <radialGradient id="tile-light" cx="0" cy="0" r="1" gradientTransform="translate(52 38) rotate(77) scale(86 70)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#484c4e" stop-opacity=".28"/>
      <stop offset=".72" stop-color="#111314" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
