    <path id="bubble" d="M64 26C42.5 26 25 41 25 59.5c0 10.2 5.4 19.4 14 25.5 3.4 2.4-.6 9.1-4.1 12.6-1.8 1.8-1 2.5 1.6 2.3 7.3-.4 11.1-2.7 16.1-6.4 1.7-1.3 3.5-.8 5.5-.6 1.9.2 3.9.3 5.9.3 21.5 0 39-15 39-33.7S85.5 26 64 26Z"/>
