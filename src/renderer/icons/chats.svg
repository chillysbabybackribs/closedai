      <stop offset=".75" stop-color="#7bba97" stop-opacity="0"/>
      <stop offset="1" stop-color="#092b1b" stop-opacity=".22"/>
    </radialGradient>
    <linearGradient id="jade-edge" x1="58" y1="26" x2="65" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d5f6df" stop-opacity=".65"/>
      <stop offset=".25" stop-color="#9dd2b1" stop-opacity=".25"/>
      <stop offset=".6" stop-color="#204b35" stop-opacity=".2"/>
