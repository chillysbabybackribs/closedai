<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="tile" x1="64" y1="4" x2="64" y2="123" gradientUnits="userSpaceOnUse">
      <stop stop-color="#494c4e"/>
      <stop offset=".16" stop-color="#292c2f"/>
      <stop offset=".72" stop-color="#1c1f21"/>
      <stop offset="1" stop-color="#090b0c"/>
    </linearGradient>
    <radialGradient id="tile-light" cx="0" cy="0" r="1" gradientTransform="translate(52 38) rotate(77) scale(86 70)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#484c4e" stop-opacity=".28"/>
      <stop offset=".72" stop-color="#111314" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
    <linearGradient id="tile-edge" x1="64" y1="4" x2="64" y2="123" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".025"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="paper" x1="45" y1="41" x2="82" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3eedc"/>
      <stop offset=".58" stop-color="#e6dfcb"/>
      <stop offset="1" stop-color="#c2b79a"/>
    </linearGradient>
    <linearGradient id="binding" x1="61" y1="24" x2="64" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4d98d"/>
      <stop offset=".3" stop-color="#dfb857"/>
      <stop offset=".78" stop-color="#c99733"/>
      <stop offset="1" stop-color="#94691f"/>
    </linearGradient>
    <linearGradient id="paper-edge" x1="47" y1="24" x2="80" y2="101" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7dd" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#eee5cc" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7d704f" stop-opacity=".8"/>
    </linearGradient>
    <filter id="depth" x="15" y="13" width="103" height="107" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".8"/>
      <feDropShadow dx="0" dy=".8" stdDeviation=".45" flood-color="#251c09" flood-opacity=".7"/>
    </filter>
