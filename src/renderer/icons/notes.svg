  <!-- Hand-built ruled notepad on the same charcoal tile as Chats and Browser. -->
  <rect x="4" y="6" width="120" height="119" rx="29" fill="#080a0b" fill-opacity=".6"/>
  <rect x="4" y="4" width="120" height="119" rx="29" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="119" rx="29" fill="url(#tile-light)"/>
  <rect x="4.5" y="4.5" width="119" height="118" rx="28.5" stroke="url(#tile-edge)"/>
  <g filter="url(#depth)">
    <g transform="rotate(-7 64 63)">
      <rect x="33" y="27" width="62" height="76" rx="2" fill="#88723e"/>
      <path d="M34 97h60v3H34Z" fill="#b7ab8a"/>
      <path d="M34 100h60" stroke="#eee3c4" stroke-opacity=".65"/>
      <rect x="33" y="24" width="62" height="74" rx="2" fill="url(#paper)"/>
      <path d="M35 24h58a2 2 0 0 1 2 2v17H33V26a2 2 0 0 1 2-2Z" fill="url(#binding)"/>
      <path d="M35 25h58" stroke="#fff0b8" stroke-opacity=".6" stroke-linecap="round"/>
      <path d="M33 43h62" stroke="#78551c" stroke-opacity=".6"/>
      <path d="M34 44h60" stroke="#fff5da" stroke-opacity=".55"/>
      <path d="M39 48h50" stroke="#918466" stroke-opacity=".65" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 5"/>
      <path d="M40 56h48M40 65h48M40 74h48M40 83h48M40 92h34" stroke="#929a98" stroke-opacity=".65" stroke-width="1.15" stroke-linecap="round"/>
      <rect x="33.4" y="24.4" width="61.2" height="73.2" rx="1.6" stroke="url(#paper-edge)" stroke-width=".8"/>
