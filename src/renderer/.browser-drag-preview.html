<!doctype html><html><head><title>Browser drag verification</title></head><body><div id="root"></div>
<script type="module">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
import { ChatCanvas } from './chat-layout/chat-canvas.tsx';
import { BROWSER_PANE_ID, CHAT_DRAG_TYPE, dockBrowser } from './chat-layout/layout-tree.ts';
import './styles/chat/layout.css';
window.events = [];
for (const name of ['dragstart','dragover','dragleave','drop','dragend','blur']) window.addEventListener(name, e => window.events.push({type:name, target:e.target?.tagName, data:e.dataTransfer?.getData(CHAT_DRAG_TYPE), types:Array.from(e.dataTransfer?.types??[])}));
function App() {
 const [tree,setTree] = useState({kind:'split',id:'all',axis:'horizontal',ratio:.7,first:{kind:'split',id:'chats',axis:'horizontal',ratio:.5,first:{kind:'pane',id:'a'},second:{kind:'pane',id:'b'}},second:{kind:'pane',id:BROWSER_PANE_ID}});
 const [active,setActive] = useState(false);
 window.result={tree,active};
 return React.createElement(ChatCanvas,{tree, selectedId:'a', busy:false,browserVisible:true, onDragActive:setActive,onToggleBrowser:()=>{},title:id=>id,renderPane:id=>React.createElement('textarea',{defaultValue:'Retained draft '+id}),onSelect:()=>{},onSelectTab:()=>{},onCloseTab:()=>{},onNewChat:()=>{},onDock:(id,target,edge)=>setTree(t=>dockBrowser(t,target,edge,crypto.randomUUID())),onHide:()=>{},onResize:()=>{},renderBrowser:React.createElement('button',{'data-ui':'layout.browser-drag',className:'browser-layout-drag',draggable:true,onDragStart:e=>{e.dataTransfer.setData(CHAT_DRAG_TYPE,BROWSER_PANE_ID);e.dataTransfer.effectAllowed='move';},style:{height:38,flex:'none'}},'Move browser')});
}
createRoot(document.getElementById('root')).render(React.createElement(App));
</script><style>html,body,#root{margin:0;width:100%;height:100%;background:#202124;color:#eee}#root{display:flex}textarea{margin:20px}button{color:inherit} .browser-layout-drag{width:120px}</style></body></html>
