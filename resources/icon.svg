<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="AppV1 CodeApp">
  <title>AppV1 CodeApp</title>
  <desc>Dark charcoal field with a soft open-arch mark. Accent centered on composer stop-ink #ff8f8f.</desc>
  <defs>
    <linearGradient id="arch" gradientUnits="userSpaceOnUse" x1="190" y1="820" x2="834" y2="210">
      <stop offset="0%" stop-color="#e85a5a"/>
      <stop offset="30%" stop-color="#ff8f8f"/>
      <stop offset="50%" stop-color="#ffaaaa"/>
      <stop offset="70%" stop-color="#ff8f8f"/>
      <stop offset="100%" stop-color="#e85a5a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feFlood flood-color="#ff8f8f" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#202124"/>
  <path filter="url(#glow)" fill="url(#arch)" fill-rule="evenodd" d="
    M 512 170
    C 710 170 850 322 850 528
    L 850 752
    A 98 98 0 0 1 654 752
    L 654 528
    C 654 412 592 335 512 335
    C 432 335 370 412 370 528
    L 370 752
    A 98 98 0 0 1 174 752
    L 174 528
    C 174 322 314 170 512 170
    Z
    M 512 335
    C 592 335 654 412 654 528
    L 654 752
    L 370 752
    L 370 528
    C 370 412 432 335 512 335
    Z"/>
</svg>
