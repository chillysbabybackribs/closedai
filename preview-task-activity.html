<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task activity preview</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
    <style>
      body { margin: 0; }
      .preview { width: 520px; height: 620px; }
      .preview-scroll { flex: 1 1 0; }
      .preview-composer { height: 132px; border: 1px solid var(--hairline-strong); border-radius: 16px; background: var(--antigravity-card-bg); }
    </style>
  </head>
  <body>
    <main class="prompt-chat preview">
      <div class="preview-scroll"></div>
      <div class="task-activity-strip">
        <div class="task-generation-loader" role="status" aria-label="Reading chat-pane.tsx…">
          <span aria-hidden="true" class="task-generation-grid">
            <span class="task-generation-cell rounded-[3px]" data-active></span>
            <span class="task-generation-cell rounded-[3px]"></span>
            <span class="task-generation-cell rounded-[3px]" data-active></span>
            <span class="task-generation-cell rounded-[3px]"></span>
            <span class="task-generation-cell rounded-[3px]" data-active></span>
            <span class="task-generation-cell rounded-[3px]"></span>
            <span class="task-generation-cell rounded-[3px]"></span>
            <span class="task-generation-cell rounded-[3px]" data-active></span>
            <span class="task-generation-cell rounded-[3px]"></span>
          </span>
          <span class="task-generation-copy" aria-hidden="true">Reading chat-pane.tsx…</span>
        </div>
      </div>
      <form class="prompt-composer">
        <div class="prompt-composer-input preview-composer"></div>
      </form>
    </main>
  </body>
</html>
