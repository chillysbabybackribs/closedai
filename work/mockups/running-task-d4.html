<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Running task options</title>
<script src="./running-icons.js"></script>
<style>
@font-face {
  font-family: "Inter Variable";
  src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
  font-weight: 100 900;
}
@font-face {
  font-family: "Geist Mono";
  src: url("../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2");
  font-weight: 100 900;
}
:root {
  color-scheme: dark;
  --card: #141516;
  --copy: #e9eaec;
  --activity: #696a6c;
  --activity-hover: #a0a4ab;
  --command: #b2a1e5;
  --edit: #d3b477;
  --tool: #83b5db;
  --running: #d3b477;
  --add: #7fbf8f;
  --del: #e08787;
  font-family: "Inter Variable", Inter, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 22px; background: #0b0c0d; color: var(--copy); }
.grid { display: grid; grid-template-columns: repeat(2, 640px); gap: 22px; justify-content: center; }
.label { margin: 0 0 8px 4px; font-size: 13px; font-weight: 600; color: #e3e5e8; }
.label span { margin-left: 8px; font-weight: 400; color: #8a8f98; }

/* The chat card, as applied in cards.css (option 3 edge + close shadow). */
.chat {
  position: relative; height: 380px; padding: 28px 32px; border-radius: 16px; background: var(--card);
  box-shadow: 0 2px 5px -2px rgb(0 0 0 / 32%), 0 10px 24px -14px rgb(0 0 0 / 55%),
    inset 0 0 0 1px rgb(255 255 255 / 6%), inset 0 1px 0 rgb(255 255 255 / 5%);
  overflow: hidden;
}
.user {
  width: fit-content; max-width: 80%; margin: 0 0 18px auto; padding: 9px 14px; border-radius: 14px;
  background: #1f2022; font-size: 15px; line-height: 1.6;
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 5%), inset 0 1px 0 rgb(255 255 255 / 4%);
}
.assistant { margin: 0 0 12px; font-size: 15px; line-height: 1.65; color: var(--copy); }
svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.spin { animation: rot 900ms linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; }

/* Shared headline, identical to the shipped trigger. */
.head { display: flex; align-items: center; gap: 12px; }
.trigger { display: inline-flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 4px; font-size: 15px; font-weight: 500; line-height: 1.4; color: var(--activity); }
.shimmer {
  --spread: 70px;
  background-image:
    linear-gradient(90deg, transparent calc(50% - var(--spread)), var(--activity-hover), transparent calc(50% + var(--spread))),
    linear-gradient(var(--activity), var(--activity));
  background-repeat: no-repeat, repeat; background-size: 250% 100%, auto;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 2s linear infinite;
}
@keyframes shimmer { from { background-position: 100% center, 0 0; } to { background-position: 0% center, 0 0; } }
.lines { margin-left: auto; padding-right: 6px; display: inline-flex; gap: 6px; font-size: 13px; }
.lines .a { color: var(--add); } .lines .d { color: var(--del); }

/* B — live line: one current step under the headline. */
.live { position: relative; height: 26px; margin: 2px 0 0 6px; overflow: hidden; }
.live-row { position: absolute; inset: 0; display: flex; align-items: center; gap: 9px; padding: 0 6px; font-size: 15px; color: var(--activity-hover); transition: transform 320ms cubic-bezier(.2,.7,.2,1), opacity 320ms ease; }
.live-row .i { color: var(--running); }
.live-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-row .t b { font-weight: 500; }
.live-row .t .lbl { color: var(--activity); }
.live-row .m { font-size: 12px; color: var(--activity); }
.live-row.out { transform: translateY(-100%); opacity: 0; }
.live-row.in { transform: translateY(100%); opacity: 0; }

/* C — rail: the list opens itself while running, steps joined by a hairline. */
.rail { margin: 4px 0 0 6px; }
.rail .earlier { padding: 2px 6px 4px 29px; font-size: 12px; color: var(--activity); }
.rail ol { margin: 0; padding: 0; list-style: none; position: relative; }
.rail li { position: relative; display: flex; align-items: center; gap: 9px; min-height: 28px; padding: 0 6px; font-size: 15px; color: var(--activity); }
.rail li + li::before { content: ''; position: absolute; left: 12.5px; top: -7px; height: 14px; width: 1px; background: rgb(255 255 255 / 9%); }
.rail li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail li .t b { font-weight: 500; }
.rail li .m { font-size: 12px; }
.rail li[data-k=command] .i { color: var(--command); }
.rail li[data-k=edit] .i { color: var(--edit); }
.rail li[data-k=tool] .i { color: var(--tool); }
.rail li[data-now] { color: var(--activity-hover); }
.rail li[data-now] .i { color: var(--running); }
.rail li[data-now] .m { color: var(--activity-hover); }

/* D — satin panel: a quiet raised surface with a step meter and the output tail. */
.panel {
  margin-top: 4px; padding: 12px 14px 12px; border-radius: 12px;
  background: linear-gradient(180deg, rgb(255 255 255 / 2.5%), rgb(255 255 255 / 1%));
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 6%), inset 0 1px 0 rgb(255 255 255 / 5%), 0 6px 16px -10px rgb(0 0 0 / 60%);
}
.p-head { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 500; color: var(--activity-hover); }
.p-head .i { color: var(--running); }
.p-head .elapsed { font-size: 12px; font-weight: 400; color: var(--activity); }
.p-head .lines { padding-right: 0; }
.meter { display: flex; gap: 3px; margin: 11px 0 10px; }
.meter i { height: 3px; flex: 1; border-radius: 2px; background: rgb(255 255 255 / 7%); }
.meter i[data-k=command] { background: color-mix(in srgb, var(--command) 70%, transparent); }
.meter i[data-k=edit] { background: color-mix(in srgb, var(--edit) 70%, transparent); }
.meter i[data-k=tool] { background: color-mix(in srgb, var(--tool) 70%, transparent); }
.meter i[data-now] { background: var(--running); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.p-step { display: flex; align-items: center; gap: 9px; font-size: 15px; color: var(--activity-hover); }
.p-step .i { color: var(--command); }
.p-step .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tail { margin: 7px 0 0 23px; padding-left: 10px; border-left: 1px solid rgb(255 255 255 / 8%); color: var(--activity); line-height: 1.55; white-space: pre; overflow: hidden; }
.tail .ok { color: var(--add); }

@media (prefers-reduced-motion: reduce) { .spin, .shimmer, .meter i[data-now] { animation: none; } }

.wrap { width: 640px; margin: 0 auto; }
.chat.short { height: auto; padding-bottom: 24px; }
.p-head .count { font-size: 12px; font-weight: 400; color: var(--activity); }
.panel { position: relative; overflow: hidden; }
.roll { position: relative; height: 24px; margin-top: 12px; overflow: hidden; }
.roll .p-step { position: absolute; inset: 0; transition: transform 380ms cubic-bezier(.2,.7,.2,1), opacity 380ms ease; }
.roll .p-step.in { transform: translateY(100%); opacity: 0; }
.roll .p-step.out { transform: translateY(-100%); opacity: 0; }
.p-step[data-k=edit] .i { color: var(--edit); }
.p-step[data-k=tool] .i { color: var(--tool); }
.tailbox { position: relative; height: calc(3 * 1.55em); margin: 7px 0 0 23px; padding-left: 10px; border-left: 1px solid rgb(255 255 255 / 8%); overflow: hidden; font-size: 13px; }
.tailbox .tl { position: absolute; left: 10px; right: 0; top: 0; line-height: 1.55; color: var(--activity); transition: transform 300ms cubic-bezier(.2,.7,.2,1); }
.tailbox .tl div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="wrap">
  <p class="label">D4 · Satin panel, rolling <span>no divider; the step line and output roll up instead of swapping</span></p>
  <div class="chat short">
    <div class="user">Run the activity tests and fix anything that fails</div>
    <p class="assistant">I’ll run the activity suite first, then patch whatever breaks.</p>
    <div class="panel">
      <div class="p-head">
        <svg class="i spin" viewBox="0 0 24 24" data-i="loader-circle"></svg>
        <span>Working</span><span class="elapsed num" id="total">· 0:42</span><span class="count" id="count">· 3 steps</span>
        <span class="lines num"><span class="a">+<span id="add">0</span></span><span class="d">−<span id="del">0</span></span></span>
      </div>
      <div class="roll" id="roll"></div>
      <div class="tailbox mono"><div class="tl" id="tail"></div></div>
    </div>
  </div>
</div>
<script>
document.querySelectorAll('svg[data-i]').forEach((s) => { s.innerHTML = RI[s.dataset.i] })
const icon = (n) => `<svg class="i" viewBox="0 0 24 24">${RI[n]}</svg>`
const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
const steps = [
  { k: 'command', icon: 'square-terminal', verb: 'Running', lbl: 'npm run test:one -- activity-steps', mono: true, add: 0, del: 0,
    out: ['RUN  v3.2 src/renderer', '✓ activity-steps.test.ts (14)', '✗ step icon follows phase', 'Tests  1 failed | 14 passed'] },
  { k: 'edit', icon: 'file-pen-line', verb: 'Editing', lbl: 'activity-step-list.tsx', add: 18, del: 4,
    out: ['@@ -96,9 +96,12 @@', '-  if (step.phase === \'running\')', '+  if (isLive(step))', '+    return <Spinner />'] },
  { k: 'edit', icon: 'file-pen-line', verb: 'Editing', lbl: 'activity-steps.css', add: 24, del: 6,
    out: ['@@ -128,4 +128,8 @@', '+.activity-step[data-phase=running]', '+  color: var(--activity-running);'] },
  { k: 'command', icon: 'square-terminal', verb: 'Running', lbl: 'npm run build', mono: true, add: 24, del: 6,
    out: ['vite v6.3 building for production…', '✓ 1,284 modules transformed.', 'rendering chunks (3/5)…', 'rendering chunks (5/5)…', 'computing gzip size…', '✓ built in 6.42s'] }
]
const roll = document.getElementById('roll'), tail = document.getElementById('tail')
let si = 0, stepSec = 0, total = 42, lines = [], shown = 0
function setStep() {
  const s = steps[si % steps.length]
  const row = document.createElement('div')
  row.className = 'p-step in'; row.dataset.k = s.k
  row.innerHTML = `${icon(s.icon)}<span class="t"><b style="font-weight:500">${s.verb}</b> <span class="${s.mono ? 'mono' : ''}">${s.lbl}</span></span><span class="num" style="font-size:12px;color:var(--activity)">0:00</span>`
  const old = roll.firstElementChild
  roll.appendChild(row)
  requestAnimationFrame(() => requestAnimationFrame(() => { row.classList.remove('in'); old?.classList.add('out') }))
  setTimeout(() => old?.remove(), 420)
  document.getElementById('count').textContent = `· ${3 + (si % steps.length)} steps`
  document.getElementById('add').textContent = s.add
  document.getElementById('del').textContent = s.del
  lines = s.out; shown = 0; tail.innerHTML = ''; tail.style.transition = 'none'; tail.style.transform = 'translateY(0)'
  stepSec = 0; si++
}
function pushLine() {
  if (shown >= lines.length) return
  const d = document.createElement('div'); d.textContent = lines[shown++]
  if (d.textContent.startsWith('✓')) d.style.color = 'var(--add)'
  if (d.textContent.startsWith('✗')) d.style.color = 'var(--del)'
  tail.appendChild(d)
  const over = Math.max(0, tail.children.length - 3)
  tail.style.transition = ''; tail.style.transform = `translateY(-${over * 1.55}em)`
}
setStep(); pushLine()
setInterval(() => {
  stepSec++; total++
  const m = roll.lastElementChild?.querySelector('.num'); if (m) m.textContent = fmt(stepSec)
  document.getElementById('total').textContent = `· ${fmt(total)}`
}, 1000)
setInterval(pushLine, 900)
setInterval(setStep, 5400)
</script>
</body>
</html>
