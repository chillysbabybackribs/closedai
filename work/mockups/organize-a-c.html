.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

const FINAL_FULL = `<h3>Docs audit: about 140 problems across the current guides, and one real code bug</h3>
<p>About 140 claims in the current guides are wrong or missing. Roughly 1,100 others match the code. I didn’t edit any docs. The one file I changed is the generated workspace index: <code>map:check</code> was failing, so I regenerated it.</p>
<h4>Fix first</h4><ol><li><b>Your <code>/home/dp/Documents/CLAUDE.md</code> describes a different, older Gemini project.</b> It points to files that don’t exist here.</li><li><b>The audit script can’t see two tools</b> and doesn’t read <code>docs/README.md</code>.</li><li><b><code>browser_cdp.capture_spa</code> has no catalog entry</b>, so the Tools dialog shows a generated name.</li></ol>
<h4>application.md (58)</h4><ul><li>Chat-card sections still describe chat tabs and joined windows…</li><li>Dock, title bar and menubar describe the old chrome…</li><li>Five layout presets, not two…</li></ul>
<h4>tools.md (24)</h4><ul><li>Locking section contradicts the lock rules in source…</li><li><code>peer_chats.search</code> is no longer literal-only…</li></ul>
<h4>Model context and providers (19)</h4><ul><li>Cursor baseline is undocumented…</li><li><code>closedai.runtime</code> field list is incomplete…</li></ul>
<h4>Remaining guides (39)</h4><ul><li><code>site-discover.md</code> has 3 wrong claims…</li><li>CDP foundation doc contradicts itself…</li></ul>
<h4>How do you want to proceed?</h4><p><b>A (recommended): highest-value fixes first.</b> Remove the stale CLAUDE.md, fix the audit script, add the catalog entry, fix the chat-card and chrome sections… <b>B:</b> everything, section by section. <b>C:</b> only the code-side fixes.</p>`

/* ---------- renderers ---------- */
const row = (k, icon, text, meta = '', chev = true) => `<div class="row" data-k="${k}">${I(icon)}<span class="t">${text}</span>${meta ? `<span class="m num">${meta}</span>` : ''}${chev ? I('chevron-right', 'chev') : ''}</div>`
const live = (verb, obj, t) => `<div class="row" data-k="command">${I('square-terminal')}<span class="t"><span class="shimmer">${verb}</span> <span class="mono" style="color:var(--dim)">${obj}</span></span><span class="m num">${t}</span></div>`
const firstSentence = (html) => { const m = html.match(/^(.*?[.:])(\s|<|$)/); return m ? m[1] : html }
const short = (html) => `<p class="prose quiet">${firstSentence(html)}<span class="more">more ${I('chevron-down')}</span></p>`

function card(r, opts2 = {}) {
  const s = state(r)
  const icon = s === 'done' ? 'circle-check' : s === 'run' ? 'loader-circle' : 'clock'
  const meta = s === 'done'
    ? `<b>${r.found} problems</b> · <i>${r.ok} confirmed</i>`
    : s === 'run' ? 'Running · findings not in yet' : 'Waiting on its own sub-audit'
  const note = s !== 'done' && r.runNote ? `<div class="rc-note">${I(s === 'run' ? 'rotate-ccw' : 'clock')}${r.runNote}</div>` : ''
  const gist = s === 'done' ? `<div class="rc-gist">${r.gist}</div>` : ''
  const body = opts2.open && s === 'done' ? `<div class="rc-body"><ul>${r.body.map((b) => `<li>${b}</li>`).join('')}</ul></div>` : ''
  return `<div class="rc${opts2.open && s === 'done' ? ' open' : ''}" data-s="${s}" data-card="${r.id}"><div class="rc-top">${I(icon)}<span class="t">${r.title}</span></div><div class="rc-meta num">${meta}</div>${gist}${note}${body}</div>`
}

function chatToday() {
  const run = opts.moment === 'run'
  let h = `<div class="user">${PROMPT}</div>`
  if (run) {
    h += `<div class="turn-head">Working for <span class="num">&nbsp;9m 12s</span></div>`
    for (const it of TODAY_RUN) {
      if (it[0] === 'p') h += `<div class="prose">${it[1]}</div>`
      else if (it[0] === 'row') h += row(it[1], 'square-terminal', it[2])
      else if (it[0] === 'bg') h += `<div class="row" data-k="bg">${I('layers')}<span class="t"><span class="shimmer">Running</span> 5 subagents in the background</span><span class="m">${it[2]}</span>${I('chevron-right', 'chev')}</div>`
      else h += live(it[1], it[2], it[3])
    }
  } else {
    h += `<div class="turn-head">Worked for 14m 32s ${I('chevron-right')}</div><div class="prose">${FINAL_FULL}</div>`
  }
  return h
}

function chatA(withCanvas) {
  const run = opts.moment === 'run'
  const done = REPORTS.filter((r) => state(r) === 'done').length
  let h = `<div class="user">${PROMPT}</div>`
  if (run) {
    h += `<div class="turn-head">Working for <span class="num">&nbsp;9m 12s</span></div>`
    h += short(TODAY_RUN[0][1])
    h += row('command', 'square-terminal', 'Ran 5 commands')
    h += `<p class="prose quiet">Five audits are running in parallel. One finding already: <code>CLAUDE.md</code> describes a different project.<span class="more">more ${I('chevron-down')}</span></p>`
    if (withCanvas) {
      h += canvasLine(`${done} of 5 reports in · 43 problems so far`)
    } else {
      h += `<div class="row" data-k="bg">${I('layers')}<span class="t"><span class="shimmer">Running</span> 5 audits in the background</span><span class="m num">${done} of 5 reported</span>${I('chevron-down', 'chev')}</div>`
      h += `<div class="tray">${REPORTS.map((r) => card(r)).join('')}</div>`
    }
    // Re-narrated reports shrink to their headline; status-only lines live on the cards.
    h += `<p class="prose quiet">The model-context and provider audit is in: 19 problems, about 70 claims confirmed.<span class="more">more ${I('chevron-down')}</span></p>`
    h += `<p class="prose quiet">The <code>tools.md</code> audit is done: the script’s tool list is stale, and <code>capture_spa</code> has no catalog entry.<span class="more">more ${I('chevron-down')}</span></p>`
    h += live('Running', 'grep -rn "TOOL_CATALOG" src/main/tools/catalog.ts', '0:04')
  } else {
    h += `<div class="turn-head">Worked for 14m 32s ${I('chevron-right')}</div>`
    if (withCanvas) h += canvasLine(`5 reports · ${total} problems · ${confirmed.toLocaleString()} confirmed`, true)
    else {
      h += `<div class="row" data-k="bg">${I('layers')}<span class="t">Ran 5 audits in the background</span><span class="m num">${total} problems · ${confirmed.toLocaleString()} confirmed</span>${I('chevron-down', 'chev')}</div>`
      h += `<div class="tray">${REPORTS.map((r) => card(r)).join('')}</div>`
    }
    h += `<div class="prose"><h3>Docs audit: about 140 problems, and one real code bug</h3>
      <p>About 140 claims in the current guides are wrong or missing; roughly 1,100 match the code. I didn’t edit any docs.</p>
      <h4>Fix first</h4><ol><li><b><code>/home/dp/Documents/CLAUDE.md</code> describes an older Gemini project.</b></li><li><b>The audit script can’t see two tools.</b></li><li><b><code>capture_spa</code> has no catalog entry.</b></li></ol></div>`
    h += withCanvas
      ? `<div class="sections"><span class="chip accent">${I('panel-right')}Full report and options in the canvas</span></div>`
      : `<div class="sections"><span class="chip">${I('chevron-down')}application.md (58)</span><span class="chip">${I('chevron-down')}tools.md (24)</span><span class="chip">${I('chevron-down')}Model context (19)</span><span class="chip">${I('chevron-down')}Remaining guides (39)</span><span class="chip">${I('chevron-down')}How to proceed</span></div>`
    h += `<p class="prose">Pick A, B or C and I’ll start; I recommend <b>A</b>, the highest-value fixes first.</p>`
  }
  return h
}

const canvasLine = (status, done) => `<div class="canvas-line" data-active>${I('panel-right')}<div><div class="t">Task canvas · Docs audit</div><div class="s num">${status}</div></div><span class="open">Open in browser ${I('arrow-up-right')}</span></div>`

/* ---------- browser pane ---------- */
function browser() {
  const ac = opts.view === 'ac'
  const tabs = [`<div class="tab">${I('globe')}<span>reddit.com</span></div>`, `<div class="tab" ${ac ? '' : 'data-on'}>${I('file-text')}<span>application.md</span></div>`]
  if (ac) tabs.push(`<div class="tab" data-on data-canvas>${I('panel-right')}<span>Docs audit · canvas</span></div>`)
  document.getElementById('tabs').innerHTML = tabs.join('')
  document.querySelector('.addr').innerHTML = `${I('arrow-left')}${I('arrow-right')}${I('rotate-ccw')}<div class="url">${ac ? `${I('panel-right')} closedai://canvas/docs-audit` : `${I('file-text')} docs/application.md`}</div>`
  document.getElementById('page').innerHTML = ac ? canvas() : `<div class="blank-doc"><h1>Application guide</h1><p>The browser pane shows whatever the user last opened. In views Today and A, long content still lives in the chat, so the pane plays no part in the task.</p></div>`
}

function canvas() {
  const run = opts.moment === 'run', model = opts.canvas === 'model'
  const done = REPORTS.filter((r) => state(r) === 'done')
  let h = `<div class="cv"><div class="cv-head"><h1>Docs audit</h1>${run ? `<span class="pill run">${I('loader-circle')}Running · 9m 12s</span>` : `<span class="pill done">${I('circle-check')}Done · 14m 32s</span>`}</div>`
  h += `<div class="cv-sub">“${PROMPT}” · Opus 5.5 · closedai</div>`
  if (model) {
    h += `<div class="cv-sec"><h2>Brief <span class="by">${I('sparkles')}Written by the model</span></h2><div class="panel brief">${run
      ? 'Two of five audits are in with 43 problems. The pattern so far: docs describe features that moved (search, dock, context blocks) rather than ones that broke. Three auditors returned status lines instead of findings and were restarted; expect the full count in about five minutes.'
      : 'About 140 claims are wrong or missing across the current guides; roughly 1,100 match the code. Almost all drift comes from two redesigns — floating chat cards and the new window chrome — plus a stale tool list in the audit script that hid two tools. One real bug: <code>capture_spa</code> is missing from the tool catalog.'}</div></div>`
  }
  h += `<div class="cv-sec"><h2>${I('list-checks')}Plan</h2><div class="panel plan">
    <div class="ok">${I('circle-check')}Run the <code>audit:docs</code> baseline<span class="m">0:41</span></div>
    <div class="${run ? 'run' : 'ok'}">${I(run ? 'loader-circle' : 'circle-check')}Audit every current guide in 5 parallel passes<span class="m num">${run ? `${done.length} of 5` : '5 of 5'}</span></div>
    <div class="${run ? 'todo' : 'ok'}">${I(run ? 'clock' : 'circle-check')}Compile one report with fixes ranked<span class="m">${run ? '' : '13:58'}</span></div>
  </div></div>`
  if (!run) {
    h += `<div class="cv-sec"><h2>${I('circle-alert')}Findings by guide</h2><div class="panel"><table><tr><th>Guide</th><th>Mix</th><th class="n">Problems</th><th class="n">Confirmed</th></tr>${REPORTS.map((r) => {
      const w = (n) => `${(n / r.found) * 100}%`
      return `<tr><td>${r.title}</td><td><div class="bar2"><i style="width:${w(r.stale)};background:#e08787"></i><i style="width:${w(r.missing)};background:#d3b477"></i><i style="width:${w(r.dead || 0)};background:#83b5db"></i></div></td><td class="n num">${r.found}</td><td class="n num" style="color:#7c8086">${r.ok}</td></tr>`
    }).join('')}</table></div><div style="margin:8px 2px 0;font-size:11.5px;color:#6c7076"><span style="color:#e08787">■</span> wrong &nbsp; <span style="color:#d3b477">■</span> missing &nbsp; <span style="color:#83b5db">■</span> dead reference</div></div>`
    h += `<div class="cv-sec"><h2>Fix first</h2><div class="panel fix"><div><b>1</b><span><code>/home/dp/Documents/CLAUDE.md</code> describes an older Gemini project; remove or relocate it.</span></div><div><b>2</b><span>The audit script’s tool list misses <code>site.discover</code> and <code>capture_spa</code>, and it doesn’t read <code>docs/README.md</code>.</span></div><div><b>3</b><span>Add the missing <code>capture_spa</code> catalog entry.</span></div></div></div>`
  }
  h += `<div class="cv-sec"><h2>${I('layers')}Reports <span class="by" style="color:#7c8086">click a card to read it</span></h2><div class="grid2">${REPORTS.map((r) => card(r, { open: r.id === openCard })).join('')}</div></div>`
  if (!run && model) {
    h += `<div class="cv-sec"><h2>Next step <span class="by">${I('sparkles')}Written by the model</span></h2><div class="choices">
      <div class="choice" data-rec><h5>A</h5><p>Highest-value fixes first: stale CLAUDE.md, audit script, catalog entry, chat-card and chrome sections.</p></div>
      <div class="choice"><h5>B</h5><p>Everything, guide by guide, with a check after each.</p></div>
      <div class="choice"><h5>C</h5><p>Only the code-side fixes; docs later.</p></div></div></div>`
  }
  h += `<div class="cv-sec"><h2>${I('clock')}Timeline</h2><div class="panel timeline">
    <div><span class="tm">0:00</span>Started; ran the <code>audit:docs</code> baseline</div>
    <div><span class="tm">0:52</span>Launched 5 audits; found the stale CLAUDE.md</div>
    <div><span class="tm">3:10</span>3 audits returned status lines; restarted them</div>
    <div><span class="tm">7:45</span>CDP sub-audit in: 9 problems</div>
    <div><span class="tm">8:30</span>Model-context audit in: 19 problems</div>
    <div><span class="tm">9:05</span>tools.md audit in: 24 problems</div>
    ${run ? '' : '<div><span class="tm">12:40</span>Both application.md halves in: 58 problems</div><div><span class="tm">14:32</span>Report written; waiting for your choice</div>'}
  </div></div>`
  h += `<div class="cv-sec"><h2>${I('file-pen-line')}Files changed</h2><div class="panel timeline"><div>${run ? 'None yet' : '<code>docs/workspace-index.md</code> · regenerated by <code>npm run map</code>'}</div></div></div>`
  return h + '</div>'
}

/* ---------- notes + wiring ---------- */
const NOTES = {
  today: '<b>Today.</b> Every status update and every re-told report lands in the chat at full length: 13 paragraphs while it runs. The fold hides them afterwards, but the final answer is itself a full report.',
  a: '<b>A · Organized chat.</b> Narration that has been superseded shrinks to its first sentence (“more” opens it). Each subagent becomes a card: running, waiting or done, with its counts and a two-line gist, and “restarted” notes sit on the card instead of in the chat. The final answer keeps its summary and “Fix first”; its long sections become chips you open.',
  ac: '<b>A + C · Chat + canvas.</b> The chat keeps the short narration and the answer’s summary; the cards move into a canvas tab in the browser pane, which fills in live: plan, report cards, findings table, fix-first list, timeline and files changed. “Assembled by the app” is built only from what the transcript already records. “+ Model-written sections” adds a brief and the next-step choices written by the model.'
}
function render() {
  document.getElementById('chat').innerHTML = opts.view === 'today' ? chatToday() : chatA(opts.view === 'ac')
  document.getElementById('note').innerHTML = NOTES[opts.view]
  document.getElementById('send').innerHTML = opts.moment === 'run' ? I('square') : I('arrow-up')
  document.getElementById('send').toggleAttribute('data-idle', opts.moment !== 'run')
  document.querySelector('[data-key=canvas]').toggleAttribute('data-off', opts.view !== 'ac')
  browser()
}
document.querySelectorAll('.seg').forEach((seg) => {
  const sync = () => seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === opts[seg.dataset.key]))
  seg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; opts[seg.dataset.key] = b.dataset.v; sync(); render() })
  sync()
})
document.getElementById('page').addEventListener('click', (e) => { const c = e.target.closest('[data-card]'); if (c) { openCard = openCard === c.dataset.card ? null : c.dataset.card; render() } })
render()
// Fit the whole stage (chat + browser) into whatever width the pane has.
const fit = () => { const z = Math.min(1, (innerWidth - 36) / 1414); document.querySelector('.stage').style.zoom = z; document.querySelectorAll('.bar, .note').forEach((e) => { e.style.maxWidth = `${1414 * z}px` }) }
addEventListener('resize', fit); fit()
</script>
</body>
</html>
