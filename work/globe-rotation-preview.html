<div id="earth-motion-preview" aria-label="Browser globe rotation preview">
  <style>
    #earth-motion-preview { font-family: system-ui, sans-serif; color: light-dark(#292929, #ddd); }
    #earth-motion-preview .earth-label { margin: 0 0 8px; font-size: 12px; }
    #earth-motion-preview .earth-row { margin-bottom: 22px; }
    #earth-motion-preview .earth-toolbar { display: flex; align-items: center; justify-content: center; gap: 8px; background: #191919; padding: 5px 16px; height: 44px; box-sizing: border-box; border-bottom: 1px solid #333; }
    #earth-motion-preview .earth-search { flex: 1; max-width: 420px; height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; border: 1px solid #393939; box-shadow: inset 0 1px 2px #101010; border-radius: 6px; padding: 0 10px; color: #aaa; font-size: 14px; }
    #earth-motion-preview .earth-search svg { width: 14px; height: 14px; }
    #earth-motion-preview .earth-button { width: 36px; height: 34px; padding: 0; border: 0; display: grid; place-items: center; background: transparent; color: #eee; cursor: pointer; flex-shrink: 0; }
    #earth-motion-preview .earth-button img, #earth-motion-preview .earth-button canvas { width: 24px; height: 24px; display: block; transition: filter 140ms ease-out; }
    #earth-motion-preview .earth-button:hover img, #earth-motion-preview .earth-button:hover canvas { filter: brightness(1.15); }
    #earth-motion-preview .earth-detail { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    #earth-motion-preview .earth-magnified { background: #191919; padding: 16px; display: grid; place-items: center; }
    #earth-motion-preview .earth-magnified canvas { display: block; width: 96px; height: 96px; }
    #earth-motion-preview .earth-detail-label { font-size: 12px; margin-bottom: 10px; }
    @media (prefers-reduced-motion: reduce) { #earth-motion-preview .earth-button img, #earth-motion-preview .earth-button canvas { transition: none; } }
  </style>

  <div class="earth-row">
    <div class="earth-label">Rotate on hover · 24 px</div>
    <div class="earth-toolbar">
      <div class="earth-search"><i data-lucide="search" aria-hidden="true"></i>Search chats</div>
      <button class="earth-button earth-animated" type="button" aria-label="Preview rotating browser globe"><canvas width="128" height="128" aria-hidden="true"></canvas></button>
    </div>
  </div>
  <div class="earth-detail">
    <div class="earth-magnified"><canvas width="128" height="128" role="img" aria-label="Enlarged view of Earth rotating around its north-south axis"></canvas></div>
    <div>
      <div class="earth-detail-label">4× detail</div>
      <button class="btn earth-play" type="button" aria-pressed="false" disabled>Loading Earth…</button>
      <span class="sr-only earth-status" aria-live="polite"></span>
    </div>
  </div>
  <script>
  (() => {
    const root = document.getElementById('earth-motion-preview');
    const small = root.querySelector('.earth-animated canvas');
    const detail = root.querySelector('.earth-magnified canvas');
    const button = root.querySelector('.earth-animated');
    const play = root.querySelector('.earth-play');
    const status = root.querySelector('.earth-status');
    const smallContext = small.getContext('2d');
    const detailContext = detail.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const settings = { revolution: 24 };
    const size = 128;
    const pixels = detailContext.createImageData(size, size);
    const points = [];
    let texture, textureWidth, textureHeight;
    let longitude = -0.8, pinned = false, hovered = false, focused = false;
    let frame = 0, previousTime = 0;
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const nx = (x + 0.5 - size / 2) / (size / 2 - 2);
        const ny = -(y + 0.5 - size / 2) / (size / 2 - 2);
        const radius = Math.hypot(nx, ny);
        if (radius >= 1) continue;
        const nz = Math.sqrt(1 - radius * radius);
        const latitude = Math.asin(ny);
        const azimuth = Math.atan2(nx, nz);
        const light = Math.max(0, nx * -0.35 + ny * 0.4 + nz * 0.846);
        points.push({ offset: (y * size + x) * 4, latitude, azimuth,
          light: 0.48 + light * 0.7, rim: Math.pow(1 - nz, 4) * 0.42,
          alpha: Math.min(1, (1 - radius) * 62) * 255 });
      }
    }
    function draw() {
      if (!texture) return;
      for (const p of points) {
        const u = ((p.azimuth + longitude) / (2 * Math.PI) + 0.5 + 2) % 1;
        const v = 0.5 - p.latitude / Math.PI;
        const source = (Math.min(textureHeight - 1, Math.floor(v * textureHeight)) * textureWidth + Math.floor(u * textureWidth)) * 4;
        const atmosphere = [65, 145, 235];
        for (let channel = 0; channel < 3; channel++) {
          pixels.data[p.offset + channel] = texture[source + channel] * p.light * (1 - p.rim) + atmosphere[channel] * p.rim;
        }
        pixels.data[p.offset + 3] = p.alpha;
      }
      detailContext.putImageData(pixels, 0, 0);
      smallContext.clearRect(0, 0, size, size);
      smallContext.drawImage(detail, 0, 0);
      root.dataset.longitude = longitude.toFixed(4);
    }
    function running() { return texture && !document.hidden && (pinned || (!reduced.matches && (hovered || focused))); }
    function tick(time) {
      frame = 0;
      if (!running()) { previousTime = 0; return; }
      if (previousTime) longitude += Math.min(time - previousTime, 70) / 1000 * Math.PI * 2 / settings.revolution;
      previousTime = time;
      draw();
      frame = requestAnimationFrame(tick);
    }
    function sync() {
      play.textContent = pinned ? 'Pause rotation' : 'Play rotation';
      play.setAttribute('aria-pressed', String(pinned));
      root.dataset.playing = String(Boolean(running()));
      if (running() && !frame) frame = requestAnimationFrame(tick);
      if (!running()) { cancelAnimationFrame(frame); frame = 0; previousTime = 0; }
    }
    button.addEventListener('pointerenter', () => { hovered = true; sync(); });
    button.addEventListener('pointerleave', () => { hovered = false; sync(); });
    button.addEventListener('focus', () => { focused = true; sync(); });
    button.addEventListener('blur', () => { focused = false; sync(); });
    function toggle() { pinned = !pinned; hovered = false; focused = false; sync(); }
    play.addEventListener('click', toggle);
    button.addEventListener('click', toggle);
    reduced.addEventListener('change', sync);
    document.addEventListener('visibilitychange', sync);
    const map = new Image();
    map.crossOrigin = 'anonymous';
    map.onload = () => {
      const source = document.createElement('canvas');
      textureWidth = source.width = 1024;
      textureHeight = source.height = 512;
      const context = source.getContext('2d', { willReadFrequently: true });
      context.drawImage(map, 0, 0, textureWidth, textureHeight);
      texture = context.getImageData(0, 0, textureWidth, textureHeight).data;
      draw();
      play.disabled = false;
      root.dataset.ready = 'true';
      sync();
    };
    map.onerror = () => { play.textContent = 'Earth texture unavailable'; status.textContent = 'The Earth texture could not load.'; };
    map.src = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/earth_atmos_2048.jpg';
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: root, onChange: sync });
      tweak.addSlider(settings, 'revolution', { label: 'Full rotation', min: 12, max: 48, step: 4, unit: 's' });
    }
  })();
  </script>
